name: USDT Price Send

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: price-send
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Keep workflow alive
        continue-on-error: true
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/run.yml/enable
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r price-bot/requirements.txt

      - name: Run hourly batch
        run: python price-bot/hourly_runner.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
